# Note: 'version' is removed as it's obsolete in Docker Compose V2
services:
  # Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pasc-cca-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      
      # Use DATABASE_URL from .env file
      DATABASE_URL: ${DATABASE_URL}
      
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "${APP_PORT:-4000}:${PORT:-4000}"
    networks:
      - pasc-network
    # Add DNS servers for better external connectivity on Windows
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Allow container to reach host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        echo '🔄 Synchronizing database schema...' &&
        npx prisma db push --skip-generate &&
        echo '✅ Schema synchronized!' &&
        echo '🚀 Starting application...' &&
        node dist/index.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/events', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

networks:
  pasc-network:
    driver: bridge